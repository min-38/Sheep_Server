# main에 머지되면 검사하고, 통과하면 OCI 서버에서 서버 main과 클라 main으로 이미지를 다시 빌드해 띄움 (SHEEP-182, 기술 설계서 배포).
# develop과 PR에서는 돌지 않음. 그쪽 검사는 PR마다 손으로 돌리고 결과를 PR 본문에 적음.
# 클라 repo(min-38/Sheep_Client)에도 같은 deploy 잡이 있음. 서버에서 도는 스크립트를 고치면 둘 다 고침.
# 저장소 시크릿: SSH_HOST · SSH_USER · SSH_KEY · SSH_PORT(없으면 22) · SSH_FINGERPRINT. MIRROR와 같은 값임
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 토큰은 읽기만 함. 이 워크플로는 저장소에 아무것도 쓰지 않음
permissions:
  contents: read

# 배포가 겹치면 앞선 것을 취소하지 않고 줄 세움. 빌드 도중에 죽으면 컨테이너가 애매하게 남기 때문임
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # lockfile과 다른 패키지를 받으려 하면 실패함 (Directory.Build.props RestorePackagesWithLockFile)
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore
      - run: dotnet test --no-build
      - run: dotnet format --verify-no-changes --no-restore

  deploy:
    needs: check # 검사가 깨지면 서버에 나가지 않음
    runs-on: ubuntu-latest
    steps:
      - name: 서버에서 받아 다시 빌드하고 띄우기
        # 서드파티 액션은 커밋으로 고정함. 태그가 옮겨져도 SSH 키를 남의 코드에 넘기지 않음
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # 서버 호스트 키의 SHA256 지문. 중간에서 서버 행세를 하면 끊음. 시크릿이 비면 확인하지 않음
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            # 서버와 클라 repo의 배포가 함께 오면 서버에서 빌드가 겹치지 않게 줄 세움. concurrency는 repo마다라 서로 모름
            exec 9>/tmp/sheep-deploy.lock
            flock 9
            cd /home/ubuntu/docker/github/Sheep_Server
            git fetch --prune origin
            # 서버에서 손댄 것이 있어도 origin/main이 이김. git에 없는 compose 파일은 그대로 남음
            git reset --hard origin/main
            # 클라는 이미지를 만들 때 이 커밋을 받아 빌드함(Dockerfile CLIENT_REF). 브랜치 이름이면 Docker가 캐시로 건너뜀
            client=$(git ls-remote https://github.com/min-38/Sheep_Client.git refs/heads/main | cut -f1)
            [ -n "$client" ] || { echo "클라 main 커밋을 못 읽음"; exit 1; }
            echo "서버 $(git rev-parse HEAD), 클라 $client"
            # 접속 계정은 docker 그룹이 아니라 sudo로 부름. -n이라 비밀번호를 물으면 기다리지 않고 실패함
            sudo -n docker compose build --build-arg CLIENT_REF="$client"
            sudo -n docker compose up -d
            # 다시 빌드할 때마다 이름표를 잃은 옛 이미지와 빌드 캐시가 쌓여 디스크가 참. 캐시는 3일 지난 것만 지움
            sudo -n docker image prune -f
            sudo -n docker builder prune -f --filter until=72h || echo "빌드 캐시를 못 지움. 손으로 sudo docker builder prune"

      - name: 게임 주소가 열리는지
        # Caddy 뒤 컨테이너가 안 뜨면 502가 옴
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://duel.umbyul.com/ || true)
            [ "$code" = 200 ] && { echo "https://duel.umbyul.com/ 200"; exit 0; }
            sleep 3
          done
          echo "https://duel.umbyul.com/ 이 200이 아님: $code"
          exit 1
